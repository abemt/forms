services:
  form680:
    build: .
    container_name: form680-autonotes
    ports:
      - "8787:8787"
    environment:
      ENGINE: ${ENGINE:-auto}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-4}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-3}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-6}
      JOB_TTL_HOURS: ${JOB_TTL_HOURS:-168}
    volumes:
      - form680-data:/app/data
    restart: unless-stopped

volumes:
  form680-data:
